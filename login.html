<!DOCTYPE html>
<html lang="ht">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Koneksyon — LAJONÈ'M</title>

    <meta
        name="description"
        content="Koneksyon sou platfòm LAJONÈ'M."
    >

    <!-- =====================================================
         GOOGLE FONT
    ====================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         STYLE
    ====================================================== -->

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        :root {

            --ble: #0B3B75;

            --ble-fonse: #082d59;

            --or: #F2B705;

            --vet: #2E8B57;

            --blan: #FFFFFF;

            --gri: #667085;

            --gri-le: #f5f7fa;

            --bord: #d0d5dd;

            --wouj: #b42318;

        }


        body {

            min-height: 100vh;

            font-family:
                "Montserrat",
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #082d59 0%,
                    #0B3B75 50%,
                    #145ca8 100%
                );

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 25px;

        }


        .container {

            width: 100%;

            max-width: 480px;

        }


        /* =================================================
           BRAND
        ================================================== */

        .brand {

            text-align: center;

            color: white;

            margin-bottom: 30px;

        }


        .logo {

            width: 92px;

            height: 92px;

            margin:
                0 auto 18px;

            border-radius: 50%;

            background: var(--or);

            color: var(--ble);

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 40px;

            font-weight: 800;

            box-shadow:
                0 10px 25px
                rgba(0,0,0,0.18);

        }


        .brand h1 {

            font-size: 34px;

            font-weight: 800;

            letter-spacing: -0.5px;

            margin-bottom: 7px;

        }


        .brand p {

            font-size: 15px;

            opacity: 0.9;

        }


        /* =================================================
           LOGIN CARD
        ================================================== */

        .login-card {

            background: white;

            border-radius: 22px;

            padding: 34px 30px;

            box-shadow:
                0 20px 60px
                rgba(0,0,0,0.20);

        }


        .login-card h2 {

            text-align: center;

            color: var(--ble);

            font-size: 25px;

            font-weight: 800;

            margin-bottom: 9px;

        }


        .subtitle {

            text-align: center;

            color: var(--gri);

            font-size: 13px;

            line-height: 1.65;

            margin-bottom: 25px;

        }


        /* =================================================
           MESSAGE
        ================================================== */

        .message {

            display: none;

            padding: 13px 14px;

            border-radius: 10px;

            margin-bottom: 18px;

            font-size: 13px;

            line-height: 1.55;

        }


        .message.error {

            display: block;

            background: #fff1f0;

            color: var(--wouj);

            border:
                1px solid #fecdca;

        }


        .message.success {

            display: block;

            background: #ecfdf3;

            color: #027a48;

            border:
                1px solid #abefc6;

        }


        .message.info {

            display: block;

            background: #eff8ff;

            color: #175cd3;

            border:
                1px solid #b2ddff;

        }


        /* =================================================
           FORM
        ================================================== */

        .form-group {

            margin-bottom: 18px;

        }


        label {

            display: block;

            color: #172033;

            font-size: 13px;

            font-weight: 700;

            margin-bottom: 8px;

        }


        input {

            width: 100%;

            height: 53px;

            border:
                1px solid var(--bord);

            border-radius: 10px;

            padding:
                0 15px;

            font-family: inherit;

            font-size: 14px;

            color: #172033;

            outline: none;

            background: white;

            transition: 0.2s;

        }


        input:focus {

            border-color: var(--ble);

            box-shadow:
                0 0 0 3px
                rgba(11,59,117,0.10);

        }


        /* =================================================
           LOGIN BUTTON
        ================================================== */

        .btn-login {

            width: 100%;

            height: 54px;

            border: none;

            border-radius: 10px;

            background: var(--ble);

            color: white;

            font-family: inherit;

            font-size: 15px;

            font-weight: 800;

            cursor: pointer;

            transition: 0.2s;

        }


        .btn-login:hover {

            background: var(--ble-fonse);

        }


        .btn-login:disabled {

            opacity: 0.65;

            cursor: not-allowed;

        }


        /* =================================================
           LOADER
        ================================================== */

        .loader {

            display: inline-block;

            width: 17px;

            height: 17px;

            border:
                2px solid
                rgba(255,255,255,0.35);

            border-top-color: white;

            border-radius: 50%;

            animation:
                spin 0.7s linear infinite;

            vertical-align: middle;

            margin-right: 7px;

        }


        @keyframes spin {

            to {

                transform:
                    rotate(360deg);

            }

        }


        /* =================================================
           BACK LINK
        ================================================== */

        .back {

            display: block;

            text-align: center;

            margin-top: 24px;

            color: var(--ble);

            font-size: 13px;

            font-weight: 700;

            text-decoration: none;

        }


        .back:hover {

            text-decoration: underline;

        }


        /* =================================================
           FOOTER
        ================================================== */

        .footer {

            text-align: center;

            color: white;

            margin-top: 25px;

            font-size: 12px;

            opacity: 0.85;

            line-height: 1.7;

        }


        /* =================================================
           MOBILE
        ================================================== */

        @media (max-width: 500px) {

            body {

                padding: 18px;

            }


            .brand h1 {

                font-size: 29px;

            }


            .logo {

                width: 82px;

                height: 82px;

                font-size: 35px;

            }


            .login-card {

                padding:
                    28px 20px;

            }

        }

    </style>

</head>


<body>


    <div class="container">


        <!-- =================================================
             BRAND
        ================================================== -->

        <div class="brand">

            <div class="logo">
                L
            </div>

            <h1>
                LAJONÈ'M
            </h1>

            <p>
                Laj yo se onè nou.
            </p>

        </div>



        <!-- =================================================
             LOGIN CARD
        ================================================== -->

        <div class="login-card">

            <h2>
                Koneksyon
            </h2>


            <p class="subtitle">

                Antre ak kont ou pou jwenn aksè
                nan espas LAJONÈ'M ki koresponn
                ak wòl ou.

            </p>



            <!-- =================================================
                 MESSAGE
            ================================================== -->

            <div
                id="message"
                class="message"
            ></div>



            <!-- =================================================
                 FORM
            ================================================== -->

            <form id="loginForm">


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">

                        Adrès email

                    </label>


                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="egzanp@email.com"
                        autocomplete="email"
                        required
                    >

                </div>



                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">

                        Modpas

                    </label>


                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Antre modpas ou"
                        autocomplete="current-password"
                        required
                    >

                </div>



                <!-- BUTTON -->

                <button
                    type="submit"
                    id="btnLogin"
                    class="btn-login"
                >

                    Konekte

                </button>


            </form>



            <!-- BACK -->

            <a
                href="index.html"
                class="back"
            >

                ← Retounen sou sit LAJONÈ'M

            </a>


        </div>



        <!-- =================================================
             FOOTER
        ================================================== -->

        <div class="footer">

            LAJONÈ'M —
            Wè. Akonpaye. Valorizasyon.

        </div>


    </div>



    <!-- =====================================================
         SUPABASE CDN
         
         Li dwe vini ANVAN js/supabase.js
    ====================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- =====================================================
         SUPABASE CLIENT
    ====================================================== -->

    <script src="js/supabase.js"></script>
    
    <script src="js/paramet.js"></script>




    <!-- =====================================================
         LOGIN SYSTEM
    ====================================================== -->

    <script>

        /* =====================================================
           ELEMENTS
        ====================================================== */

        const loginForm =
            document.getElementById(
                "loginForm"
            );


        const emailInput =
            document.getElementById(
                "email"
            );


        const passwordInput =
            document.getElementById(
                "password"
            );


        const btnLogin =
            document.getElementById(
                "btnLogin"
            );


        const message =
            document.getElementById(
                "message"
            );



        /* =====================================================
           MESSAGE
        ====================================================== */

        function montreMesaj(
            texte,
            kalite = "error"
        ) {

            message.textContent =
                texte;

            message.className =
                "message " + kalite;

        }


        function efaseMesaj() {

            message.textContent =
                "";

            message.className =
                "message";

        }



        /* =====================================================
           NON WÒL
        ====================================================== */

        function jwennNonWol(
            wol
        ) {

            const nonWol = {

                "super_admin":
                    "Super Administratè",

                "admin":
                    "Administratè",

                "editè":
                    "Editè",

                "volonte":
                    "Volontè"

            };


            return (
                nonWol[wol] ||
                "Itilizatè"
            );

        }



        /* =====================================================
           REDIRECTION SELON WÒL
        ====================================================== */

        function redirijeSelonWol(
            wol
        ) {

            console.log(
                "🔐 Wòl detekte:",
                wol
            );


            /*
             * VOLONTÈ
             *
             * Li pa ale nan admin.html.
             */

            if (
                wol ===
                "volonte"
            ) {

                console.log(
                    "➡️ Redirection volontè..."
                );


                window.location.replace(
                    "espas-volonte.html"
                );


                return true;

            }



            /*
             * ADMINISTRASYON
             */

            if (

                wol ===
                    "super_admin"

                ||

                wol ===
                    "admin"

                ||

                wol ===
                    "editè"

            ) {

                console.log(
                    "➡️ Redirection administrasyon..."
                );


                window.location.replace(
                    "admin.html"
                );


                return true;

            }


            return false;

        }



        /* =====================================================
           CHACHE PROFIL AKTIF
        ====================================================== */

        async function chacheProfil(
            userId
        ) {

            const {

                data,

                error

            } =

                await supabaseClient

                    .from(
                        "itilizatè_admin"
                    )

                    .select(`
                        id,
                        user_id,
                        non,
                        siyati,
                        email,
                        wòl,
                        aktif
                    `)

                    .eq(
                        "user_id",
                        userId
                    )

                    .eq(
                        "aktif",
                        true
                    )

                    .maybeSingle();


            if (error) {

                console.error(
                    "❌ Erè chajman profil:",
                    error
                );


                throw new Error(
                    "Nou pa kapab verifye otorizasyon kont ou."
                );

            }


            return data;

        }



        /* =====================================================
           LOGIN
        ====================================================== */

        loginForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                efaseMesaj();


                const email =
                    emailInput.value
                        .trim()
                        .toLowerCase();


                const password =
                    passwordInput.value;


                if (
                    !email ||
                    !password
                ) {

                    montreMesaj(
                        "Tanpri antre email ak modpas ou."
                    );

                    return;

                }


                btnLogin.disabled =
                    true;


                btnLogin.innerHTML = `

                    <span class="loader"></span>

                    Koneksyon...

                `;


                try {


                    /* =========================================
                       1. VERIFYE CLIENT SUPABASE
                    ========================================== */

                    if (
                        typeof supabaseClient ===
                        "undefined"
                    ) {

                        throw new Error(
                            "Sistèm Supabase la pa disponib. Verifye js/supabase.js."
                        );

                    }



                    /* =========================================
                       2. LOGIN AUTH
                    ========================================== */

                    const {

                        data:
                            authData,

                        error:
                            authError

                    } =

                        await supabaseClient

                            .auth

                            .signInWithPassword({

                                email:
                                    email,

                                password:
                                    password

                            });


                    if (authError) {

                        console.error(
                            "❌ Auth error:",
                            authError
                        );


                        throw new Error(
                            "Email oswa modpas la pa kòrèk."
                        );

                    }


                    if (
                        !authData ||
                        !authData.user
                    ) {

                        throw new Error(
                            "Nou pa kapab jwenn kont itilizatè a."
                        );

                    }


                    const user =
                        authData.user;


                    console.log(
                        "✅ Auth reyisi:",
                        user.email
                    );



                    /* =========================================
                       3. CHACHE PWOFIL LA
                    ========================================== */

                    const profil =
                        await chacheProfil(
                            user.id
                        );


                    /* =========================================
                       4. PA GEN PROFIL
                    ========================================== */

                    if (!profil) {


                        await supabaseClient

                            .auth

                            .signOut();


                        throw new Error(
                            "Kont sa a poko gen yon pwofil otorize nan LAJONÈ'M."
                        );

                    }



                    /* =========================================
                       5. VERIFYE AKTIF
                       
                       Nou deja itilize:
                       .eq("aktif", true)

                       Men nou verifye l ankò.
                    ========================================== */

                    if (
                        profil.aktif !== true
                    ) {

                        await supabaseClient

                            .auth

                            .signOut();


                        throw new Error(
                            "Kont sa a pa aktive pou itilize platfòm LAJONÈ'M."
                        );

                    }



                    /* =========================================
                       6. NORMALIZE WÒL
                    ========================================== */

                    const wol =

                        String(
                            profil.wòl ||
                            ""
                        )

                        .trim()

                        .toLowerCase();


                    console.log(
                        "👤 Non:",
                        profil.non,
                        profil.siyati
                    );


                    console.log(
                        "🔐 Wòl:",
                        wol
                    );



                    /* =========================================
                       7. VERIFYE WÒL LA
                    ========================================== */

                    const wolOtorize = [

                        "super_admin",

                        "admin",

                        "editè",

                        "volonte"

                    ];


                    if (
                        !wolOtorize.includes(
                            wol
                        )
                    ) {

                        await supabaseClient

                            .auth

                            .signOut();


                        throw new Error(
                            "Wòl kont sa a pa rekonèt nan sistèm LAJONÈ'M."
                        );

                    }



                    /* =========================================
                       8. MESAJ SIKSÈ
                    ========================================== */

                    montreMesaj(

                        "Koneksyon reyisi. " +

                        "Wòl ou: " +

                        jwennNonWol(
                            wol
                        ) +

                        ". N ap ouvri espas ou...",

                        "success"

                    );



                    /* =========================================
                       9. REDIRECTION
                    ========================================== */

                    setTimeout(
                        function() {

                            const ale =
                                redirijeSelonWol(
                                    wol
                                );


                            if (!ale) {

                                console.error(
                                    "❌ Pa gen redirection pou wòl:",
                                    wol
                                );

                            }

                        },
                        500
                    );


                } catch (error) {


                    console.error(
                        "❌ Erè koneksyon:",
                        error
                    );


                    montreMesaj(

                        error.message ||

                        "Nou pa kapab konekte kont sa a."

                    );


                    btnLogin.disabled =
                        false;


                    btnLogin.textContent =
                        "Konekte";

                }

            }
        );



        /* =====================================================
           VERIFYE SI GEN SESSION DEJA
           
           Sa itil lè itilizatè a retounen sou login.html
           pandan li deja konekte.
        ====================================================== */

        async function verifyeSession() {

            try {


                if (
                    typeof supabaseClient ===
                    "undefined"
                ) {

                    console.error(
                        "❌ supabaseClient pa disponib."
                    );

                    return;

                }


                const {

                    data,

                    error

                } =

                    await supabaseClient

                        .auth

                        .getSession();


                if (error) {

                    console.error(
                        "❌ Erè session:",
                        error
                    );

                    return;

                }


                const session =
                    data?.session;


                if (!session) {

                    return;

                }


                console.log(
                    "🔎 Session deja egziste."
                );


                const profil =
                    await chacheProfil(
                        session.user.id
                    );


                if (!profil) {

                    await supabaseClient

                        .auth

                        .signOut();

                    return;

                }


                if (
                    profil.aktif !== true
                ) {

                    await supabaseClient

                        .auth

                        .signOut();

                    return;

                }


                const wol =

                    String(
                        profil.wòl ||
                        ""
                    )

                    .trim()

                    .toLowerCase();


                const wolOtorize = [

                    "super_admin",

                    "admin",

                    "editè",

                    "volonte"

                ];


                if (
                    !wolOtorize.includes(
                        wol
                    )
                ) {

                    await supabaseClient

                        .auth

                        .signOut();

                    return;

                }


                redirijeSelonWol(
                    wol
                );


            } catch (error) {

                console.error(
                    "❌ Erè verifye session:",
                    error
                );

            }

        }



        /* =====================================================
           LANSE SESSION CHECK
        ====================================================== */

        verifyeSession();

    </script>

</body>

</html>
