<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin — Nouvèl | LAJONÈ'M</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Open+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --ble: #0B3B75;
      --ble-fonse: #082d59;
      --lò: #F2B705;
      --vèt: #2E8B57;
      --blan: #ffffff;
      --gri: #f4f6f8;
      --gri2: #e5e7eb;
      --tèks: #1f2937;
      --wouj: #dc2626;
      --zoranj: #f59e0b;
      --lonbraj: 0 8px 25px rgba(0,0,0,.08);
      --rayon: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Open Sans", sans-serif;
      background: var(--gri);
      color: var(--tèks);
    }

    button,
    input,
    textarea,
    select {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    /* HEADER */

    .topbar {
      height: 70px;
      background: var(--ble);
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 25px;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .logo {
      font-family: "Montserrat", sans-serif;
      font-size: 21px;
      font-weight: 800;
    }

    .logo span {
      color: var(--lò);
    }

    .top-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .top-btn {
      border: none;
      border-radius: 8px;
      padding: 9px 14px;
      font-weight: 700;
      background: rgba(255,255,255,.12);
      color: white;
    }

    .top-btn:hover {
      background: rgba(255,255,255,.2);
    }

    .menu-btn {
      display: none;
      border: none;
      background: transparent;
      color: white;
      font-size: 25px;
    }

    /* LAYOUT */

    .layout {
      display: flex;
      min-height: calc(100vh - 70px);
    }

    .sidebar {
      width: 250px;
      background: #fff;
      border-right: 1px solid var(--gri2);
      padding: 20px 12px;
      flex-shrink: 0;
    }

    .sidebar-title {
      font-size: 11px;
      text-transform: uppercase;
      color: #777;
      font-weight: 800;
      padding: 8px 12px;
      margin-bottom: 6px;
    }

    .side-link {
      width: 100%;
      display: block;
      text-decoration: none;
      color: #374151;
      padding: 11px 13px;
      border-radius: 9px;
      margin-bottom: 4px;
      font-weight: 600;
      font-size: 14px;
    }

    .side-link:hover {
      background: #f1f5f9;
      color: var(--ble);
    }

    .side-link.active {
      background: var(--ble);
      color: white;
    }

    .content {
      flex: 1;
      padding: 28px;
      min-width: 0;
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
    }

    .page-header h1 {
      font-family: "Montserrat", sans-serif;
      color: var(--ble);
      font-size: 27px;
      margin-bottom: 5px;
    }

    .page-header p {
      color: #6b7280;
      font-size: 14px;
    }

    .primary-btn {
      border: none;
      background: var(--ble);
      color: white;
      padding: 11px 18px;
      border-radius: 9px;
      font-weight: 700;
    }

    .primary-btn:hover {
      background: var(--ble-fonse);
    }

    /* STATS */

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 22px;
    }

    .stat-card {
      background: white;
      border-radius: var(--rayon);
      padding: 20px;
      box-shadow: var(--lonbraj);
    }

    .stat-label {
      color: #6b7280;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .stat-value {
      font-family: "Montserrat", sans-serif;
      font-size: 28px;
      font-weight: 800;
      color: var(--ble);
    }

    .stat-published .stat-value {
      color: var(--vèt);
    }

    .stat-draft .stat-value {
      color: var(--zoranj);
    }

    /* TOOLBAR */

    .toolbar {
      background: white;
      padding: 16px;
      border-radius: var(--rayon);
      box-shadow: var(--lonbraj);
      margin-bottom: 18px;

      display: grid;
      grid-template-columns: 1fr 200px;
      gap: 12px;
    }

    .toolbar input,
    .toolbar select {
      width: 100%;
      padding: 11px 13px;
      border: 1px solid var(--gri2);
      border-radius: 8px;
      outline: none;
      background: white;
    }

    .toolbar input:focus,
    .toolbar select:focus {
      border-color: var(--ble);
    }

    /* TABLE */

    .table-box {
      background: white;
      border-radius: var(--rayon);
      box-shadow: var(--lonbraj);
      overflow: hidden;
    }

    .table-scroll {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }

    th,
    td {
      padding: 14px 15px;
      border-bottom: 1px solid #edf0f2;
      text-align: left;
      font-size: 13px;
    }

    th {
      background: #f8fafc;
      color: #4b5563;
      font-size: 12px;
      text-transform: uppercase;
    }

    td strong {
      color: var(--ble);
    }

    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
    }

    .status-public {
      background: #dcfce7;
      color: #166534;
    }

    .status-draft {
      background: #fef3c7;
      color: #92400e;
    }

    .actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .action-btn {
      border: none;
      border-radius: 7px;
      padding: 7px 9px;
      font-size: 11px;
      font-weight: 700;
    }

    .edit-btn {
      background: #e0ecff;
      color: var(--ble);
    }

    .publish-btn {
      background: #dcfce7;
      color: #166534;
    }

    .draft-btn {
      background: #fef3c7;
      color: #92400e;
    }

    .delete-btn {
      background: #fee2e2;
      color: #991b1b;
    }

    .empty {
      text-align: center;
      padding: 45px 20px;
      color: #6b7280;
    }

    .loading {
      text-align: center;
      padding: 35px;
      color: #6b7280;
    }

    /* MODAL */

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      z-index: 2000;
      padding: 20px;
      overflow-y: auto;
    }

    .modal.show {
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }

    .modal-box {
      width: min(850px, 100%);
      background: white;
      border-radius: 16px;
      margin: 30px auto;
      box-shadow: 0 20px 60px rgba(0,0,0,.2);
      overflow: hidden;
    }

    .modal-header {
      background: var(--ble);
      color: white;
      padding: 18px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h2 {
      font-family: "Montserrat", sans-serif;
      font-size: 19px;
    }

    .close-btn {
      background: transparent;
      color: white;
      border: none;
      font-size: 25px;
      line-height: 1;
    }

    .modal-body {
      padding: 22px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    label {
      font-size: 13px;
      font-weight: 700;
      color: #374151;
    }

    input,
    textarea,
    select {
      border: 1px solid var(--gri2);
      border-radius: 8px;
      padding: 11px 12px;
      outline: none;
      background: white;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: var(--ble);
    }

    .checkbox-line {
      display: flex;
      align-items: center;
      gap: 9px;
      padding-top: 26px;
    }

    .checkbox-line input {
      width: 18px;
      height: 18px;
    }

    .modal-footer {
      padding: 16px 22px;
      border-top: 1px solid #edf0f2;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .cancel-btn {
      border: 1px solid var(--gri2);
      background: white;
      color: #374151;
      padding: 10px 17px;
      border-radius: 8px;
      font-weight: 700;
    }

    .save-btn {
      border: none;
      background: var(--vèt);
      color: white;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 700;
    }

    /* MESSAGE */

    .message {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 3000;
      min-width: 280px;
      max-width: 420px;
      background: #111827;
      color: white;
      padding: 14px 17px;
      border-radius: 10px;
      box-shadow: 0 12px 30px rgba(0,0,0,.2);
      display: none;
      font-size: 13px;
    }

    .message.show {
      display: block;
    }

    .message.success {
      background: var(--vèt);
    }

    .message.error {
      background: var(--wouj);
    }

    /* RESPONSIVE */

    @media (max-width: 900px) {
      .sidebar {
        position: fixed;
        top: 70px;
        bottom: 0;
        left: -270px;
        z-index: 1500;
        transition: .25s;
        box-shadow: 10px 0 30px rgba(0,0,0,.12);
      }

      .sidebar.open {
        left: 0;
      }

      .menu-btn {
        display: block;
      }

      .topbar {
        padding: 0 15px;
      }

      .content {
        padding: 20px 15px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .toolbar {
        grid-template-columns: 1fr;
      }

      .page-header {
        align-items: flex-start;
        flex-direction: column;
      }
    }

    @media (max-width: 650px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-group.full {
        grid-column: auto;
      }

      .checkbox-line {
        padding-top: 0;
      }

      .top-btn.site-btn {
        display: none;
      }
    }
  </style>
</head>

<script>

  let toutNouvel = [];
  let modeEdition = false;


  /* =========================
     MESSAGE
  ========================= */

  function montreMesaj(texte, type = "") {

    const box = document.getElementById("message");

    box.textContent = texte;

    box.className = "message show " + type;

    setTimeout(() => {
      box.className = "message";
    }, 3500);
  }


  /* =========================
     AUTH
  ========================= */

  async function verifyeAdministrateur() {

    const {
      data: { user },
      error
    } = await supabaseClient.auth.getUser();


    if (error || !user) {

      window.location.href = "login.html";

      return null;
    }


    const result = await supabaseClient
      .from("itilizatè_admin")
      .select(`
        id,
        user_id,
        non,
        siyati,
        email,
        wòl,
        aktif
      `)
      .eq("user_id", user.id)
      .eq("aktif", true)
      .maybeSingle();


    if (result.error) {

      console.error(result.error);

      montreMesaj(
        "Nou pa kapab verifye aksè administratè a.",
        "error"
      );

      return null;
    }


    if (!result.data) {

      await supabaseClient.auth.signOut();

      window.location.href = "login.html";

      return null;
    }


    if (
      result.data.wòl !== "super_admin" &&
      result.data.wòl !== "admin"
    ) {

      montreMesaj(
        "Ou pa gen pèmisyon pou jere nouvèl yo.",
        "error"
      );

      return null;
    }


    return result.data;
  }


  /* =========================
     SLUG
  ========================= */

  function kreyeSlug(tit) {

    return tit
      .toString()
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/[’']/g, "")
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "");
  }


  /* =========================
     DATE
  ========================= */

  function formatDate(date) {

    if (!date) return "—";

    return new Date(date).toLocaleDateString(
      "fr-FR",
      {
        day: "2-digit",
        month: "2-digit",
        year: "numeric"
      }
    );
  }


  /* =========================
     CHARGE NOUVEL
  ========================= */

  async function chajeNouvel() {

    const tbody = document.getElementById("newsTable");

    tbody.innerHTML = `
      <tr>
        <td colspan="6" class="loading">
          Ap chaje nouvèl yo...
        </td>
      </tr>
    `;


    const { data, error } = await supabaseClient
      .from("nouvel")
      .select(`
        id,
        tit,
        slug,
        rezime,
        kontni,
        imaj_url,
        kategori,
        otè,
        pibliye,
        dat_piblikasyon
      `)
      .order(
        "dat_piblikasyon",
        { ascending: false }
      );


    if (error) {

      console.error("Erè chajman nouvèl:", error);

      tbody.innerHTML = `
        <tr>
          <td colspan="6" class="empty">
            Nou pa kapab chaje nouvèl yo.
          </td>
        </tr>
      `;

      montreMesaj(
        "Erè pandan chajman nouvèl yo.",
        "error"
      );

      return;
    }


    toutNouvel = data || [];

    meteStatistik();

    montreNouvel();
  }


  /* =========================
     STATS
  ========================= */

  function meteStatistik() {

    const total = toutNouvel.length;

    const pibliye = toutNouvel.filter(
      n => n.pibliye === true
    ).length;

    const bouyon = total - pibliye;


    document.getElementById("statTotal")
      .textContent = total;

    document.getElementById("statPublished")
      .textContent = pibliye;

    document.getElementById("statDraft")
      .textContent = bouyon;
  }


  /* =========================
     AFFICHAGE
  ========================= */

  function montreNouvel() {

    const tbody = document.getElementById("newsTable");

    const recherche =
      document.getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();

    const kategori =
      document.getElementById("categoryFilter")
        .value;


    const filtre = toutNouvel.filter(nouv => {

      const texte =
        `${nouv.tit || ""} ${nouv.rezime || ""} ${nouv.otè || ""}`
          .toLowerCase();

      const okRecherche =
        !recherche ||
        texte.includes(recherche);

      const okKategori =
        !kategori ||
        nouv.kategori === kategori;

      return okRecherche && okKategori;
    });


    if (!filtre.length) {

      tbody.innerHTML = `
        <tr>
          <td colspan="6" class="empty">
            Pa gen nouvèl ki koresponn ak rechèch la.
          </td>
        </tr>
      `;

      return;
    }


    tbody.innerHTML = filtre.map(nouv => {

      const status = nouv.pibliye
        ? `
          <span class="status status-public">
            Pibliye
          </span>
        `
        : `
          <span class="status status-draft">
            Bouyon
          </span>
        `;


      const actionPublication = nouv.pibliye

        ? `
          <button
            class="action-btn draft-btn"
            onclick="chanjePublication('${nouv.id}', false)"
          >
            Depibliye
          </button>
        `

        : `
          <button
            class="action-btn publish-btn"
            onclick="chanjePublication('${nouv.id}', true)"
          >
            Pibliye
          </button>
        `;


      return `
        <tr>

          <td>
            <strong>
              ${escapeHTML(nouv.tit || "San tit")}
            </strong>
          </td>

          <td>
            ${escapeHTML(nouv.kategori || "—")}
          </td>

          <td>
            ${escapeHTML(nouv.otè || "—")}
          </td>

          <td>
            ${formatDate(nouv.dat_piblikasyon)}
          </td>

          <td>
            ${status}
          </td>

          <td>

            <div class="actions">

              <button
                class="action-btn edit-btn"
                onclick="editeNouvel('${nouv.id}')"
              >
                Modifye
              </button>

              ${actionPublication}

              <button
                class="action-btn delete-btn"
                onclick="efaseNouvel('${nouv.id}')"
              >
                Efase
              </button>

            </div>

          </td>

        </tr>
      `;

    }).join("");
  }


  /* =========================
     ESCAPE HTML
  ========================= */

  function escapeHTML(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  /* =========================
     MODAL
  ========================= */

  function ouvriModal() {

    document.getElementById("newsModal")
      .classList.add("show");
  }


  function femenModal() {

    document.getElementById("newsModal")
      .classList.remove("show");
  }


  function resetForm() {

    document.getElementById("newsForm").reset();

    document.getElementById("newsId").value = "";

    document.getElementById("otè").value = "LAJONÈ'M";

    document.getElementById("modalTitle")
      .textContent = "Ajoute yon nouvèl";

    modeEdition = false;
  }


  /* =========================
     AJOUTE
  ========================= */

  document.getElementById("addBtn")
    .addEventListener("click", () => {

      resetForm();

      ouvriModal();

    });


  document.getElementById("closeModal")
    .addEventListener("click", femenModal);


  document.getElementById("cancelBtn")
    .addEventListener("click", femenModal);


  /* =========================
     AUTO SLUG
  ========================= */

  document.getElementById("tit")
    .addEventListener("input", function() {

      if (!modeEdition) {

        document.getElementById("slug").value =
          kreyeSlug(this.value);
      }

    });


  /* =========================
     ENREGISTRE
  ========================= */

  document.getElementById("newsForm")
    .addEventListener("submit", async function(e) {

      e.preventDefault();


      const id =
        document.getElementById("newsId").value;


      const tit =
        document.getElementById("tit").value.trim();


      const slug =
        document.getElementById("slug").value.trim()
        || kreyeSlug(tit);


      const rezime =
        document.getElementById("rezime").value.trim();


      const kontni =
        document.getElementById("kontni").value.trim();


      const imaj_url =
        document.getElementById("imaj_url").value.trim()
        || null;


      const kategori =
        document.getElementById("kategori").value;


      const otè =
        document.getElementById("otè").value.trim()
        || "LAJONÈ'M";


      const datInput =
        document.getElementById("dat_piblikasyon").value;


      const pibliye =
        document.getElementById("pibliye").checked;


      const dat_piblikasyon =
        datInput
          ? new Date(datInput).toISOString()
          : new Date().toISOString();


      const payload = {

        tit,
        slug,
        rezime,
        kontni,
        imaj_url,
        kategori,
        otè,
        pibliye,
        dat_piblikasyon

      };


      let result;


      if (id) {

        result = await supabaseClient
          .from("nouvel")
          .update(payload)
          .eq("id", id);

      } else {

        result = await supabaseClient
          .from("nouvel")
          .insert(payload);

      }


      if (result.error) {

        console.error(result.error);

        montreMesaj(
          "Erè: " + result.error.message,
          "error"
        );

        return;
      }


      montreMesaj(
        id
          ? "Nouvèl la modifye avèk siksè."
          : "Nouvèl la ajoute avèk siksè.",
        "success"
      );


      femenModal();

      resetForm();

      await chajeNouvel();

    });


  /* =========================
     EDIT
  ========================= */

  function editeNouvel(id) {

    const nouv = toutNouvel.find(
      n => n.id === id
    );


    if (!nouv) return;


    modeEdition = true;


    document.getElementById("newsId").value =
      nouv.id;

    document.getElementById("tit").value =
      nouv.tit || "";

    document.getElementById("slug").value =
      nouv.slug || "";

    document.getElementById("rezime").value =
      nouv.rezime || "";

    document.getElementById("kontni").value =
      nouv.kontni || "";

    document.getElementById("imaj_url").value =
      nouv.imaj_url || "";

    document.getElementById("kategori").value =
      nouv.kategori || "LAJONÈ'M";

    document.getElementById("otè").value =
      nouv.otè || "LAJONÈ'M";

    document.getElementById("pibliye").checked =
      nouv.pibliye === true;


    if (nouv.dat_piblikasyon) {

      const date =
        new Date(nouv.dat_piblikasyon);

      const local =
        new Date(
          date.getTime()
          - date.getTimezoneOffset() * 60000
        )
        .toISOString()
        .slice(0, 16);

      document.getElementById(
        "dat_piblikasyon"
      ).value = local;
    }


    document.getElementById("modalTitle")
      .textContent = "Modifye nouvèl";


    ouvriModal();
  }


  /* =========================
     PUBLISH / UNPUBLISH
  ========================= */

  async function chanjePublication(id, value) {

    const { error } = await supabaseClient
      .from("nouvel")
      .update({
        pibliye: value
      })
      .eq("id", id);


    if (error) {

      console.error(error);

      montreMesaj(
        "Nou pa kapab chanje estati piblikasyon an.",
        "error"
      );

      return;
    }


    montreMesaj(
      value
        ? "Nouvèl la pibliye."
        : "Nouvèl la retire nan piblikasyon.",
      "success"
    );


    await chajeNouvel();
  }


  /* =========================
     DELETE
  ========================= */

  async function efaseNouvel(id) {

    const nouv = toutNouvel.find(
      n => n.id === id
    );


    if (!nouv) return;


    const konfime = confirm(
      `Èske ou sèten ou vle efase nouvèl sa a?\n\n"${nouv.tit}"`
    );


    if (!konfime) return;


    const { error } = await supabaseClient
      .from("nouvel")
      .delete()
      .eq("id", id);


    if (error) {

      console.error(error);

      montreMesaj(
        "Nou pa kapab efase nouvèl la.",
        "error"
      );

      return;
    }


    montreMesaj(
      "Nouvèl la efase avèk siksè.",
      "success"
    );


    await chajeNouvel();
  }


  /* =========================
     SEARCH
  ========================= */

  document.getElementById("searchInput")
    .addEventListener(
      "input",
      montreNouvel
    );


  document.getElementById("categoryFilter")
    .addEventListener(
      "change",
      montreNouvel
    );


  /* =========================
     MENU MOBILE
  ========================= */

  document.getElementById("menuBtn")
    .addEventListener("click", () => {

      document.getElementById("sidebar")
        .classList.toggle("open");

    });


  /* =========================
     LOGOUT
  ========================= */

  document.getElementById("logoutBtn")
    .addEventListener("click", async () => {

      await supabaseClient.auth.signOut();

      window.location.href = "login.html";

    });


  /* =========================
     INIT
  ========================= */

  async function init() {

    const admin =
      await verifyeAdministrateur();


    if (!admin) return;


    await chajeNouvel();

  }


  init();

</script>

</body>
</html>
